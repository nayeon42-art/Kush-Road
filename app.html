<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كوش رود | حسابي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--g:#c99a3e;--g2:#e4bc68;--k:#11110f;--i:#1b1a17;--l:#e9e5dc}*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Arial,sans-serif;background:#f7f4ec;color:var(--i);line-height:1.7}
header{background:var(--k);color:#fff;display:flex;gap:10px;align-items:center;padding:12px 5%;position:sticky;top:0;z-index:1100;flex-wrap:wrap}
header b{color:var(--g2);font-size:22px}header nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
a.n{color:#fff;text-decoration:none;padding:4px 12px;border-radius:99px;border:1px solid #ffffff33}
button{font:inherit;cursor:pointer}.b{background:linear-gradient(135deg,#f5d77a,#c99a3e);color:var(--i);border:0;border-radius:99px;padding:9px 20px;font-weight:700;text-decoration:none;display:inline-block}.b.o{background:#fff;border:1px solid var(--i)}.b.s{padding:3px 12px;font-size:14px}

</style></head><body><header id="hd"></header><main id="v"></main><div class="t" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,getDoc,getDocs,query,where,onSnapshot,serverTimestamp,getCountFromServer,arrayUnion,arrayRemove}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyBg9Rgjs7GMTQcWXkpwLTbNbzmNuVsv3so",authDomain:"kush-road1.firebaseapp.com",projectId:"kush-road1",storageBucket:"kush-road1.firebasestorage.app",messagingSenderId:"344953341160",appId:"1:344953341160:web:6f2ac1f351b52a73a3f55d"});
const auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),val=id=>$('#'+id).value.trim();
const T=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(T.i);T.i=setTimeout(()=>t.hidden=true,3200)};
const em=v=>v.includes('@')?v.trim():v.replace(/\D/g,'')+'@kushroad.app';
const ERR={'auth/invalid-credential':'بيانات الدخول غير صحيحة','auth/email-already-in-use':'الحساب موجود مسبقاً','auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)','auth/invalid-email':'رقم الهاتف أو البريد غير صحيح','permission-denied':'ما عندك صلاحية لهذا الإجراء'};
const fail=x=>T(ERR[x.code]||'حدث خطأ: '+(x.code||x.message));
let U=null,me=null,map=null,mk={},clean=[],redraw=()=>{},DR=[],RT={},pk=null,wid=null;
const HOME={customer:'customer',driver:'driver',woman:'driver',office:'office',ss:'admin'},go=p=>location.hash=p;
const on=(q,f)=>clean.push(onSnapshot(q,f)),live=d=>d.online&&d.lat&&Date.now()-(d.ts||0)<18e4;
const km=(a,b)=>{const r=Math.PI/180;return Math.hypot((b.lng-a.lng)*r*Math.cos((a.lat+b.lat)*r/2),(b.lat-a.lat)*r)*6371};
const avg=id=>{const l=Object.values(RT).filter(r=>r.driverId==id);return l.length?(l.reduce((a,r)=>a+r.stars,0)/l.length).toFixed(1)+' ★ ('+l.length+')':'جديد'};
const mkMap=()=>{mk={};map=L.map('map').setView([15.5,32.56],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map)};
const pin=(id,ll,t,c)=>{if(mk[id])mk[id].setLatLng(ll);else mk[id]=L.circleMarker(ll,{radius:9,color:'#000',weight:2,fillColor:c||'#e4bc68',fillOpacity:1}).addTo(map).bindPopup(t)};
const unpin=keep=>Object.keys(mk).forEach(k=>{if(!keep.includes(k)){mk[k].remove();delete mk[k]}});
const guard=ok=>{if(!U){go('login');return 0}if(!ok.includes(U.role)){T('ما عندك صلاحية لهذه الصفحة');go(HOME[U.role]);return 0}return 1};
const hd=()=>{$('#hd').innerHTML=`<b>كوش رود</b><nav><a class="n" href="index.html">الرئيسية</a><a class="n" href="#offices">المكاتب</a>${U?`<a class="n" href="#${HOME[U.role]}">لوحتي</a><a class="n" href="#customer">اطلب مواصلات</a>`:''}</nav>${U?`<span>${e(U.name)}</span><button class="b s o" id="lo">خروج</button>`:'<a class="n" href="#login">دخول</a><a class="n" href="#register">إنشاء حساب</a>'}`;$('#lo')&&($('#lo').onclick=()=>signOut(auth).then(()=>go('login')))};
const track=f=>{if(f){if(!navigator.geolocation)return T('المتصفح لا يدعم تحديد الموقع');wid=navigator.geolocation.watchPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];updateDoc(doc(db,'drivers',me),{lat:ll[0],lng:ll[1],ts:Date.now(),online:true}).catch(fail);pin('me',ll,'أنت هنا','#3b82f6');map.setView(ll,14)},()=>T('فعّل إذن الموقع للمتصفح'),{enableHighAccuracy:true})}else{if(wid!=null)navigator.geolocation.clearWatch(wid);wid=null;updateDoc(doc(db,'drivers',me),{online:false}).catch(()=>0)}};
const V={};
V.login=a=>{$('#v').innerHTML=`<div class="c" style="max-width:420px;margin:30px auto"><h2>${a=='admin'?'دخول الإدارة (SS)':'تسجيل الدخول'}</h2><input id="a1" placeholder="رقم الهاتف أو البريد"><input id="a2" type="password" placeholder="كلمة المرور"><button class="b" id="go" style="margin-top:12px;width:100%">دخول</button><p>ما عندك حساب؟ <a href="#register">أنشئ حساباً</a></p></div>`;$('#go').onclick=async()=>{try{await signInWithEmailAndPassword(auth,em(val('a1')),val('a2'))}catch(x){fail(x)}}};
const RM={office:['تسجيل مكتب تأجير',['متجر مستقل برابط عام باسم مكتبك','إضافة السيارات وحذفها','استلام الحجوزات وقبولها أو رفضها','يظهر متجرك بعد موافقة الإدارة']],driver:['تسجيل سائق حر',['موقع حي على الخريطة','استقبال طلبات المشاوير القريبة','عرض سياراتك وتقييمات الركاب','تظهر بعد موافقة الإدارة']],woman:['تسجيل سائقة (الخدمات النسائية)',['طلبات من العميلات فقط','موقع حي على الخريطة','عرض سياراتك وتقييمات الراكبات','تظهرين بعد موافقة الإدارة']]};
V.register=a=>{const R=RM[a];$('#v').innerHTML=`<div class="c" style="max-width:420px;margin:30px auto">${R?`<h2>${R[0]}</h2><p class="n">صلاحيات حسابك:</p><ul>${R[1].map(x=>`<li>${x}</li>`).join('')}</ul>`:`<h2>إنشاء حساب</h2><select id="r0"><option value="customer">عميل (مواصلات وتأجير)</option><option value="driver">سائق حر</option><option value="woman">سائقة (الخدمات النسائية)</option><option value="office">مكتب تأجير</option></select>`}<input id="r1" placeholder="الاسم (أو اسم المكتب)"><input id="r2" placeholder="رقم الهاتف"><input id="r3" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><button class="b" id="go" style="margin-top:12px;width:100%">إنشاء الحساب</button><p>عندك حساب؟ <a href="#login">سجّل الدخول</a></p></div>`;
 $('#go').onclick=async()=>{const role=R?a:$('#r0').value,n=val('r1'),p=val('r2');if(!n||!p)return T('اكتب الاسم والهاتف');const st=role=='customer'?'active':'pending';
  try{const c=await createUserWithEmailAndPassword(auth,em(p),val('r3')),id=c.user.uid;await setDoc(doc(db,'users',id),{name:n,phone:p,role,status:st,createdAt:serverTimestamp()});
   if(role=='driver'||role=='woman')await setDoc(doc(db,'drivers',id),{name:n,woman:role=='woman',vehicle:'',cars:[],status:'pending'});
   if(role=='office')await setDoc(doc(db,'offices',id),{name:n,city:'',phone:'',status:'pending'});T(st=='pending'?'تم إنشاء الحساب. بانتظار موافقة الإدارة':'مرحباً بك')}catch(x){fail(x)}}};
V.offices=()=>{$('#v').innerHTML='<div class="c"><h2>مكاتب التأجير</h2><div class="g" id="ol"></div></div>';on(query(collection(db,'offices'),where('status','==','active')),s=>{$('#ol').innerHTML=s.docs.map(d=>{const o=d.data();return `<div class="c"><b>🏪 ${e(o.name)}</b><br><span class="n">${e(o.city)}</span><br><a class="b s" href="#store=${d.id}">تصفح المتجر</a></div>`}).join('')||'<p>ما في مكاتب بعد</p>'})};
V.store=id=>{$('#v').innerHTML='<div class="c"><h2 id="sn"></h2><p class="n" id="si"></p><div class="row"><label>من<input id="f" type="date"></label><label>إلى<input id="t" type="date"></label></div></div><div class="g" id="sc" style="margin-top:14px"></div>';
 getDoc(doc(db,'offices',id)).then(s=>{const o=s.data();if(!o||o.status!='active')return $('#sn').textContent='المتجر غير متاح';$('#sn').textContent='🏪 '+o.name;$('#si').textContent=[o.city,o.phone].filter(Boolean).join(' · ')}).catch(fail);
 let cars=[];on(query(collection(db,'cars'),where('office','==',id)),s=>{cars=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.status=='live');$('#sc').innerHTML=cars.map(c=>`<div class="c"><b>${e(c.name)}</b><br><span class="n">${e(c.spec)}</span><br><b>${(+c.price).toLocaleString('en')} SDG</b> / يوم<br><button class="b s" data-b="${c.id}">احجز</button></div>`).join('')||'<p>ما في سيارات</p>';
  $('#sc').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>book(cars.find(c=>c.id==b.dataset.b)))})};
const book=async c=>{if(!U){T('سجّل الدخول أولاً');return go('login')}const f=val('f'),t=val('t');if(!f||!t||t<=f)return T('اختر تاريخ استلام وإرجاع صحيحين');
 try{const s=await getDocs(query(collection(db,'busy'),where('carId','==',c.id)));if(s.docs.some(x=>{const b=x.data();return!(t<=b.from||f>=b.to)}))return T('السيارة محجوزة في هذه التواريخ');
  const n=Math.round((new Date(t)-new Date(f))/864e5),r=await addDoc(collection(db,'bookings'),{carId:c.id,car:c.name,office:c.office,uid:me,name:U.name,from:f,to:t,total:c.price*n,status:'pending',createdAt:serverTimestamp()});
  await setDoc(doc(db,'busy',r.id),{carId:c.id,from:f,to:t});T('وصل طلب الحجز: '+(c.price*n).toLocaleString('en')+' SDG')}catch(x){fail(x)}};
V.customer=()=>{if(!guard(['customer','driver','woman','office','ss']))return;
 $('#v').innerHTML=`<div class="c"><h2>اطلب مواصلات</h2><input id="dst" placeholder="وجهتك (مثال: بحري)"><select id="wm"><option value="0">أي سائق</option><option value="1">♀ سائقات فقط</option></select><button class="b" id="loc" style="margin-top:10px">📍 حدد موقعي</button> <span class="n">أو اضغط على الخريطة</span><div id="map"></div><div class="g" id="dl" style="margin-top:12px"></div></div><div class="c"><h2>طلباتي</h2><div id="my"></div></div><div class="c"><h2>تأجير سيارة</h2><a class="b" href="#offices">تصفح مكاتب التأجير</a></div>`;mkMap();
 const setPk=(a,b)=>{pk={lat:a,lng:b};pin('pk',[a,b],'موقعك','#3b82f6');redraw()};map.on('click',x=>setPk(x.latlng.lat,x.latlng.lng));
 $('#loc').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{setPk(p.coords.latitude,p.coords.longitude);map.setView([pk.lat,pk.lng],14)},()=>T('فعّل إذن الموقع'),{enableHighAccuracy:true}):T('المتصفح لا يدعم تحديد الموقع');
 redraw=()=>{const w=$('#wm').value=='1',l=DR.filter(d=>live(d)&&!!d.woman===w);l.forEach(d=>pin(d.id,[d.lat,d.lng],e(d.name),d.woman?'#e0679a':'#e4bc68'));unpin(['pk',...l.map(d=>d.id)]);
  if(pk)l.forEach(d=>d.km=km(pk,d));l.sort((a,b)=>(a.km??0)-(b.km??0));
  $('#dl').innerHTML=l.map(d=>`<div class="c"><b>${e(d.name)}</b> ${d.woman?'♀':''}<br><span class="n">${e(d.vehicle)}</span><br>${avg(d.id)}${d.km!=null?' · '+d.km.toFixed(1)+' كم':''}<br><button class="b s" data-r="${d.id}">اطلب</button> <a href="#d=${d.id}">الملف</a></div>`).join('')||'<p>ما في سائقين متصلين الآن</p>';
  $('#dl').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const d=DR.find(x=>x.id==b.dataset.r),to=val('dst');if(!pk)return T('حدد موقعك أولاً');if(!to)return T('اكتب وجهتك');
   try{await addDoc(collection(db,'rides'),{uid:me,name:U.name,driverId:d.id,from:pk,to,woman:!!d.woman,status:'open',at:Date.now()});T('أُرسل الطلب إلى '+d.name)}catch(x){fail(x)}})};
 $('#wm').onchange=redraw;let rides=[];
 const my=()=>{$('#my').innerHTML=rides.map(r=>{const d=DR.find(x=>x.id==r.driverId),L={open:'بانتظار السائق',accepted:'✅ السائق قبل وفي الطريق',declined:'السائق اعتذر',done:'انتهى المشوار'}[r.status];
  return `<div class="c"><b>${e(r.to)}</b> · ${e(d?.name||'')}<br><span class="p">${L}</span>${r.status=='done'&&!RT[r.id]?`<br><select id="s${r.id}"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select><input id="x${r.id}" placeholder="تعليقك (اختياري)"><button class="b s" data-s="${r.id}">قيّم السائق</button>`:''}${RT[r.id]?'<br>تم تقييمك ✓':''}</div>`}).join('')||'<p>ما عندك طلبات</p>';
  $('#my').querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const r=rides.find(x=>x.id==b.dataset.s);try{await setDoc(doc(db,'ratings',r.id),{driverId:r.driverId,uid:me,name:U.name,stars:+$('#s'+r.id).value,text:val('x'+r.id),at:Date.now()});T('شكراً لتقييمك')}catch(x){fail(x)}})};
 on(query(collection(db,'drivers'),where('status','==','active')),s=>{DR=s.docs.map(d=>({id:d.id,...d.data()}));redraw();my()});
 on(collection(db,'ratings'),s=>{RT={};s.docs.forEach(d=>RT[d.id]=d.data());redraw();my()});
 on(query(collection(db,'rides'),where('uid','==',me)),s=>{rides=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);my()})};
V.d=id=>{$('#v').innerHTML='<div class="c"><h2 id="dn"></h2><p id="dv" class="n"></p><b id="da"></b></div><div class="c"><h2>سياراته</h2><div id="dc"></div></div><div class="c"><h2>تقييمات الركاب</h2><div id="dr"></div></div>';
 on(doc(db,'drivers',id),s=>{const d=s.data();if(!d)return;$('#dn').textContent=d.name+(d.woman?' ♀':'');$('#dv').textContent=d.vehicle||'';$('#dc').innerHTML=(d.cars||[]).map(c=>`<p>🚗 ${e(c.name)} · ${e(c.year)} · ${e(c.plate)}</p>`).join('')||'<p>لم يضف سيارات بعد</p>'});
 on(collection(db,'ratings'),s=>{RT={};s.docs.forEach(d=>RT[d.id]=d.data());$('#da').textContent=avg(id);$('#dr').innerHTML=Object.values(RT).filter(r=>r.driverId==id).map(r=>`<p><b>${'★'.repeat(r.stars)}</b> ${e(r.name)}: ${e(r.text)}</p>`).join('')||'<p>ما في تقييمات بعد</p>'})};
V.driver=()=>{if(!guard(['driver','woman']))return;if(U.status!='active'){$('#v').innerHTML='<div class="c">حسابك قيد المراجعة من الإدارة. تقدر تدخل بعد الموافقة.</div>';return}
 $('#v').innerHTML=`<div class="c"><h2>لوحة السائق</h2><button class="b" id="tg">▶ ابدأ استقبال الطلبات (موقع حي)</button><p class="n">يتحدث موقعك للزبائن وأنت متصل. أبقِ هذه الصفحة مفتوحة.</p><div id="map"></div></div><div class="c"><h2>الطلبات</h2><div id="rq"></div></div><div class="c"><h2>سياراتي</h2><div id="mc"></div><input id="cn" placeholder="اسم السيارة"><input id="cy" placeholder="السنة"><input id="cp" placeholder="رقم اللوحة"><button class="b" id="ac" style="margin-top:10px">إضافة سيارة</button><br><a href="#d=${me}">عرض ملفي العام</a></div><div class="c"><h2>تقييماتي</h2><div id="rt"></div></div>`;mkMap();
 clean.push(()=>{if(wid!=null)track(false)});let on_=false;$('#tg').onclick=()=>{on_=!on_;track(on_);$('#tg').textContent=on_?'⏸ إيقاف (غير متصل)':'▶ ابدأ استقبال الطلبات (موقع حي)'};
 const dd=doc(db,'drivers',me);on(dd,s=>{const d=s.data()||{};$('#mc').innerHTML=(d.cars||[]).map((c,i)=>`<p>🚗 ${e(c.name)} · ${e(c.year)} · ${e(c.plate)} <button class="b s o" data-x="${i}">حذف</button></p>`).join('')||'<p>أضف سياراتك ليراها الزبائن</p>';
  $('#mc').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>updateDoc(dd,{cars:arrayRemove(d.cars[+b.dataset.x])}).catch(fail))});
 $('#ac').onclick=()=>{const c={name:val('cn'),year:val('cy'),plate:val('cp')};if(!c.name)return T('اكتب اسم السيارة');updateDoc(dd,{cars:arrayUnion(c),vehicle:c.name}).then(()=>{['cn','cy','cp'].forEach(i=>$('#'+i).value='')}).catch(fail)};
 on(query(collection(db,'rides'),where('driverId','==',me)),s=>{const l=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.status=='open'||r.status=='accepted');
  s.docChanges().forEach(c=>{if(c.type=='added'&&c.doc.data().status=='open'){T('🔔 طلب مشوار جديد');navigator.vibrate?.(300)}});
  $('#rq').innerHTML=l.map(r=>`<div class="c"><b>${e(r.name)}</b> ← ${e(r.to)}<br>${r.status=='open'?`<button class="b s" data-a="accepted" data-i="${r.id}">قبول</button> <button class="b s o" data-a="declined" data-i="${r.id}">رفض</button>`:`<button class="b s" data-a="done" data-i="${r.id}">إنهاء المشوار</button>`}</div>`).join('')||'<p>ما في طلبات حالياً</p>';
  $('#rq').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>updateDoc(doc(db,'rides',b.dataset.i),{status:b.dataset.a}).catch(fail))});
 on(collection(db,'ratings'),s=>{RT={};s.docs.forEach(d=>RT[d.id]=d.data());$('#rt').innerHTML='<b>'+avg(me)+'</b>'+Object.values(RT).filter(r=>r.driverId==me).map(r=>`<p>${'★'.repeat(r.stars)} ${e(r.name)}: ${e(r.text)}</p>`).join('')})};
V.office=()=>{if(!guard(['office']))return;if(U.status!='active'){$('#v').innerHTML='<div class="c">مكتبك قيد المراجعة من الإدارة. يظهر متجرك بعد الموافقة.</div>';return}
 $('#v').innerHTML=`<div class="c"><h2>🏪 متجري: ${e(U.name)}</h2><input id="oc" placeholder="المدينة"><input id="op" placeholder="هاتف المكتب"><button class="b s" id="sv" style="margin-top:8px">حفظ</button> <a href="#store=${me}">عرض متجري العام</a></div><div class="c"><h2>إضافة سيارة</h2><input id="cn" placeholder="اسم السيارة"><input id="cs" placeholder="المواصفات (أوتوماتيك · 5 مقاعد)"><input id="cp" type="number" placeholder="سعر اليوم (SDG)"><button class="b" id="ac" style="margin-top:10px">نشر</button></div><div class="c"><h2>سياراتي</h2><div class="g" id="oc2"></div></div><div class="c"><h2>الحجوزات</h2><div id="ob"></div></div>`;
 on(doc(db,'offices',me),s=>{const o=s.data()||{};if(!$('#oc').value)$('#oc').value=o.city||'';if(!$('#op').value)$('#op').value=o.phone||''});
 $('#sv').onclick=()=>updateDoc(doc(db,'offices',me),{city:val('oc'),phone:val('op')}).then(()=>T('تم الحفظ')).catch(fail);
 $('#ac').onclick=()=>{const p=+val('cp');if(!val('cn')||!(p>0))return T('اكتب الاسم والسعر');addDoc(collection(db,'cars'),{name:val('cn'),spec:val('cs'),price:p,office:me,status:'live'}).then(()=>{['cn','cs','cp'].forEach(i=>$('#'+i).value='');T('انضافت السيارة')}).catch(fail)};
 on(query(collection(db,'cars'),where('office','==',me)),s=>{$('#oc2').innerHTML=s.docs.map(d=>{const c=d.data();return `<div class="c"><b>${e(c.name)}</b><br>${(+c.price).toLocaleString('en')} SDG<br><button class="b s o" data-x="${d.id}">حذف</button></div>`}).join('')||'<p>ما في سيارات</p>';$('#oc2').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>deleteDoc(doc(db,'cars',b.dataset.x)).catch(fail))});
 on(query(collection(db,'bookings'),where('office','==',me)),s=>{$('#ob').innerHTML=s.docs.map(d=>{const b=d.data();return `<div class="c"><b>${e(b.car)}</b> · ${e(b.name)}<br>${e(b.from)} ← ${e(b.to)} · ${(+b.total).toLocaleString('en')} SDG<br><span class="p">${{pending:'بانتظارك',confirmed:'مؤكد',declined:'مرفوض'}[b.status]}</span> ${b.status=='pending'?`<button class="b s" data-s="confirmed" data-i="${d.id}">قبول</button> <button class="b s o" data-s="declined" data-i="${d.id}">رفض</button>`:''}</div>`}).join('')||'<p>ما في حجوزات</p>';
  $('#ob').querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,'bookings',b.dataset.i),{status:b.dataset.s});if(b.dataset.s=='declined')await deleteDoc(doc(db,'busy',b.dataset.i))}catch(x){fail(x)}})})};
V.admin=()=>{if(!guard(['ss']))return;
 $('#v').innerHTML='<div class="g" id="st"></div><div class="c"><h2>بانتظار الموافقة</h2><h3>السائقون</h3><div id="p-drivers"></div><h3>المكاتب</h3><div id="p-offices"></div><h3>الإعلانات</h3><div id="p-listings"></div></div><div class="c"><h2>السائقون المتصلون الآن</h2><div id="map"></div></div>';mkMap();
 Promise.all(['users','drivers','offices','rides','bookings'].map(c=>getCountFromServer(collection(db,c)))).then(r=>{$('#st').innerHTML=['مستخدم','سائق','مكتب','مشوار','حجز'].map((t,i)=>`<div class="c"><b style="font-size:26px">${r[i].data().count}</b><br>${t}</div>`).join('')}).catch(fail);
 for(const c of['drivers','offices','listings'])on(query(collection(db,c),where('status','==','pending')),s=>{$('#p-'+c).innerHTML=s.docs.map(d=>`<p><b>${e(d.data().name)}</b> <button class="b s" data-c="${c}" data-i="${d.id}" data-y="1">قبول</button> <button class="b s o" data-c="${c}" data-i="${d.id}" data-y="0">رفض</button></p>`).join('')||'<p class="n">لا شيء</p>';
  $('#p-'+c).querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{const y=b.dataset.y=='1',st=y?(c=='listings'?'live':'active'):'declined',i=b.dataset.i;try{await updateDoc(doc(db,c,i),{status:st});if(c!='listings')await updateDoc(doc(db,'users',i),{status:st}).catch(()=>0)}catch(x){fail(x)}})});
 on(query(collection(db,'drivers'),where('status','==','active')),s=>{const l=s.docs.map(d=>({id:d.id,...d.data()})).filter(live);l.forEach(d=>pin(d.id,[d.lat,d.lng],e(d.name),d.woman?'#e0679a':'#e4bc68'));unpin(l.map(d=>d.id))})};
const route=()=>{clean.forEach(f=>f());clean=[];redraw=()=>{};if(map){map.remove();map=null}hd();
 const[p,a]=(location.hash.slice(1)||'login').split('=');if(me&&!U){$('#v').innerHTML='<p>جار التحميل…</p>';return}
 if(U&&p=='login'&&a=='admin'&&U.role!='ss')T('هذه البوابة للإدارة العليا فقط');if(U&&(p=='login'||p=='register'))return go(HOME[U.role]);(V[p]||V.login)(a)};
addEventListener('hashchange',route);
let un;onAuthStateChanged(auth,u=>{un?.();me=u?.uid||null;U=null;if(!u)return route();un=onSnapshot(doc(db,'users',u.uid),s=>{U=s.data()||null;route()})});
</script></body></html>
